<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Terras de Aurora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Nunito:wght@500;700;800&display=swap" />
    <style>
      /* Interface no estilo das janelas claras dos MMORPGs clássicos: painéis azul-gelo,
         barra de título azul e números dourados. O jogo tem um visual só (não muda com o tema). */
      :root {
        color-scheme: dark;
        --bg: #0b1020;
        --panel: #f3f6fc;
        --panel-2: #e2eaf7;
        --line: #93a9d6;
        --title-a: #7193d6;
        --title-b: #4565ad;
        --ink: #1d2742;
        --muted: #5b6889;
        --gold: #f2c14e;
        --gold-ink: #8a5a00;
        --hp: #3fbf5a;
        --hp-low: #e04848;
        --sp: #3c7ee0;
        --exp: #e6a531;
        --job: #9a6be0;
        --danger: #c0392b;
        --ok: #2f9e55;
        --display: 'Cinzel', 'Trajan Pro', Georgia, serif;
        --ui: 'Nunito', 'Segoe UI', system-ui, sans-serif;
      }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; font-family: var(--ui); }
      #game { position: fixed; inset: 0; }
      canvas { touch-action: none; display: block; }
      button { font-family: var(--ui); }
      button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }

      #hud { position: fixed; inset: 0; pointer-events: none; font-size: 12px; user-select: none; -webkit-user-select: none; }
      #hud > * { pointer-events: auto; }
      [hidden] { display: none !important; }

      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 2px 10px rgba(5, 10, 30, .35); }
      .tbar { background: linear-gradient(var(--title-a), var(--title-b)); color: #fff; font-weight: 800; font-size: 12px; padding: 3px 8px; border-radius: 5px 5px 0 0; display: flex; align-items: center; gap: 6px; letter-spacing: .02em; }
      .tbar .x { margin-left: auto; background: rgba(255,255,255,.2); border: 0; color: #fff; border-radius: 4px; width: 22px; height: 18px; cursor: pointer; font-weight: 800; }

      /* Janela de informações básicas */
      .basic { position: absolute; top: calc(8px + env(safe-area-inset-top, 0px)); left: max(8px, env(safe-area-inset-left, 0px)); width: 236px; }
      .basic .body { padding: 6px 8px 7px; display: grid; gap: 3px; }
      .basic .who { display: flex; justify-content: space-between; font-weight: 800; }
      .basic .who span:last-child { color: var(--muted); font-weight: 700; }
      .bar { display: grid; grid-template-columns: 38px 1fr; align-items: center; gap: 5px; font-weight: 800; font-size: 11px; color: var(--muted); }
      .bar .track { position: relative; height: 12px; background: #c9d4ea; border-radius: 3px; overflow: hidden; border: 1px solid #a8b8da; }
      .bar .fill { position: absolute; inset: 0 auto 0 0; width: 50%; transition: width .15s; }
      .bar .txt { position: absolute; inset: 0; text-align: center; font-size: 10px; line-height: 11px; color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.6); font-variant-numeric: tabular-nums; }
      .bar.hp .fill { background: var(--hp); } .bar.hp.low .fill { background: var(--hp-low); }
      .bar.sp .fill { background: var(--sp); }
      .bar.exp .fill { background: var(--exp); } .bar.job .fill { background: var(--job); }
      .bar.exp .track, .bar.job .track { height: 8px; }
      .bar.exp .txt, .bar.job .txt { line-height: 7px; font-size: 9px; }
      .basic .zeny { display: flex; justify-content: space-between; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
      .basic .zeny b { color: var(--gold-ink); }
      .menu { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; margin-top: 3px; }
      .menu button { position: relative; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 3px 0; font-size: 11px; font-weight: 800; color: var(--ink); cursor: pointer; }
      .menu button:hover { background: #fff; }
      .menu button.on { background: var(--title-b); color: #fff; }
      .menu button .dot { position: absolute; top: -5px; right: -4px; background: var(--danger); color: #fff; border-radius: 8px; font-size: 9px; padding: 0 4px; line-height: 13px; }

      /* Minimapa */
      .mini { position: absolute; top: calc(8px + env(safe-area-inset-top, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); width: 176px; }
      .mini canvas { display: block; width: 100%; height: auto; border-radius: 0 0 5px 5px; }
      .mini .coord { font-weight: 700; opacity: .9; margin-left: auto; font-variant-numeric: tabular-nums; }

      /* Alvo */
      .target { position: absolute; top: calc(8px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); width: 220px; padding: 5px 8px; display: grid; gap: 3px; }
      .target .nm { display: flex; justify-content: space-between; font-weight: 800; }
      .target .nm small { color: var(--muted); font-weight: 700; }
      .target .track { height: 9px; background: #c9d4ea; border-radius: 3px; overflow: hidden; }
      .target .fill { height: 100%; background: var(--hp-low); width: 100%; }
      .target.mvp { border-color: var(--gold); }
      .target.mvp .nm::before { content: 'MVP'; background: var(--gold); color: #4a3000; font-size: 9px; padding: 0 4px; border-radius: 3px; margin-right: 4px; align-self: center; }

      /* Registro (chat) */
      .log { position: absolute; left: max(8px, env(safe-area-inset-left, 0px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); width: min(360px, 44vw); max-height: 132px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 1px; pointer-events: none !important; }
      .log div { background: rgba(10, 16, 36, .55); color: #e9eefb; padding: 1px 6px; border-radius: 3px; font-size: 11.5px; font-weight: 700; width: fit-content; max-width: 100%; text-shadow: 0 1px 1px #000; }
      .log .item { color: #ffe08a; } .log .exp { color: #c8f0ff; } .log .warn { color: #ffb3a6; } .log .sys { color: #b9ffcb; }

      /* Barra de atalhos */
      .hotbar { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 4px; padding: 5px; background: rgba(243, 246, 252, .92); }
      .slot { position: relative; width: 46px; height: 46px; border-radius: 5px; background: #d5dff1; border: 1px solid var(--line); cursor: pointer; padding: 0; overflow: hidden; }
      .slot img { width: 38px; height: 38px; image-rendering: auto; margin-top: 1px; }
      .slot .k { position: absolute; left: 3px; top: 1px; font-size: 10px; font-weight: 800; color: var(--ink); text-shadow: 0 0 2px #fff; }
      .slot .n { position: absolute; right: 3px; bottom: 1px; font-size: 10px; font-weight: 800; color: #fff; text-shadow: 0 1px 2px #000; }
      .slot .lv { position: absolute; right: 3px; top: 1px; font-size: 9px; font-weight: 800; color: var(--title-b); }
      .slot .cd { position: absolute; inset: 0; background: conic-gradient(rgba(10,16,40,.62) var(--p, 0%), transparent 0); }
      .slot.off img { filter: grayscale(1) opacity(.45); }
      .slot.nosp { box-shadow: inset 0 0 0 2px rgba(60, 126, 224, .8); }
      .slot:hover { border-color: var(--title-b); }

      /* Janelas */
      .win { z-index: 5; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(460px, calc(100vw - 24px)); max-height: min(560px, calc(100vh - 150px)); display: flex; flex-direction: column; }
      .win .content { overflow: auto; padding: 8px 10px 10px; min-height: 0; }
      .win.wide { width: min(560px, calc(100vw - 24px)); }
      .win h3 { margin: 6px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
      .row { display: flex; align-items: center; gap: 6px; }
      .muted { color: var(--muted); }
      .btn { background: linear-gradient(#fff, var(--panel-2)); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; font-weight: 800; font-size: 12px; color: var(--ink); cursor: pointer; }
      .btn:hover { border-color: var(--title-b); }
      .btn.primary { background: linear-gradient(var(--title-a), var(--title-b)); color: #fff; border-color: var(--title-b); }
      .btn:disabled { opacity: .45; cursor: default; }
      .btn.small { padding: 1px 7px; font-size: 11px; }

      .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .stats table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
      .stats td { padding: 2px 3px; border-bottom: 1px solid var(--panel-2); }
      .stats td:first-child { font-weight: 800; }
      .stats td.v { text-align: right; font-weight: 800; }
      .stats td.v small { color: var(--ok); }
      .stats td.c { color: var(--muted); font-size: 10.5px; text-align: center; }
      .pts { margin-top: 6px; font-weight: 800; color: var(--gold-ink); }

      .grid-inv { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 5px; }
      .it { position: relative; aspect-ratio: 1; background: #fff; border: 1px solid var(--line); border-radius: 5px; cursor: pointer; display: grid; place-items: center; padding: 0; }
      .it img { width: 36px; height: 36px; }
      .it .n { position: absolute; right: 3px; bottom: 1px; font-size: 10px; font-weight: 800; color: var(--ink); }
      .it.sel { outline: 2px solid var(--title-b); }
      .it.eq::after { content: 'E'; position: absolute; left: 3px; top: 1px; font-size: 10px; font-weight: 800; color: #fff; background: var(--ok); border-radius: 3px; padding: 0 3px; }
      .equip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
      .eqslot { display: flex; gap: 6px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 5px; padding: 4px; min-width: 0; cursor: pointer; }
      .eqslot img { width: 30px; height: 30px; flex: none; }
      .eqslot div { min-width: 0; font-size: 11px; line-height: 1.2; }
      .eqslot b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .detail { margin-top: 8px; background: var(--panel-2); border-radius: 5px; padding: 7px 8px; min-height: 52px; }
      .detail b { font-size: 13px; }
      .detail p { margin: 3px 0 6px; color: var(--muted); }
      .tabs { display: flex; gap: 4px; margin-bottom: 6px; }
      .tabs .btn.on { background: var(--title-b); color: #fff; }

      .skill { display: grid; grid-template-columns: 38px 1fr auto; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--panel-2); }
      .skill img { width: 36px; height: 36px; border-radius: 5px; }
      .skill .nm { font-weight: 800; }
      .skill .nm small { color: var(--muted); font-weight: 700; }
      .skill p { margin: 1px 0 0; color: var(--muted); font-size: 11px; }
      .skill.locked { opacity: .55; }

      .shop { display: grid; gap: 4px; }
      .shop .line { display: grid; grid-template-columns: 34px 1fr auto auto; gap: 8px; align-items: center; background: #fff; border: 1px solid var(--panel-2); border-radius: 5px; padding: 3px 6px; }
      .shop img { width: 32px; height: 32px; }
      .shop .price { font-weight: 800; color: var(--gold-ink); font-variant-numeric: tabular-nums; }
      .shop small { color: var(--muted); display: block; }

      .dialog p { margin: 0 0 8px; line-height: 1.45; font-size: 13px; }
      .dialog .npc { font-weight: 800; color: var(--title-b); }
      .choices { display: grid; gap: 5px; }
      .classes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .classes .btn { display: grid; gap: 2px; padding: 8px 6px; text-align: left; }
      .classes .btn small { font-weight: 600; color: var(--muted); font-size: 10.5px; }

      .banner { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); text-align: center; pointer-events: none !important; font-family: var(--display); color: #fff; text-shadow: 0 2px 0 #3a2a00, 0 0 18px rgba(255, 200, 80, .7); font-size: 34px; font-weight: 800; letter-spacing: .04em; white-space: nowrap; opacity: 0; transition: opacity .3s, transform .3s; }
      .banner small { display: block; font-family: var(--ui); font-size: 14px; letter-spacing: .02em; text-shadow: 0 1px 3px #000; }
      .banner.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }
      .mapname { position: absolute; left: 50%; top: 12%; transform: translateX(-50%); pointer-events: none !important; text-align: center; color: #fff; font-family: var(--display); font-size: 24px; text-shadow: 0 2px 6px #000; opacity: 0; transition: opacity .6s; }
      .mapname.show { opacity: 1; }

      /* Caça automática */
      .autobox { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: grid; justify-items: center; gap: 4px; }
      .autobtn { width: 62px; height: 62px; border-radius: 50%; border: 2px solid var(--line); background: radial-gradient(circle at 50% 35%, #fff, var(--panel-2)); color: var(--muted); cursor: pointer; display: grid; place-content: center; gap: 0; box-shadow: 0 2px 10px rgba(5, 10, 30, .35); position: relative; }
      .autobtn b { font: 800 15px var(--display); letter-spacing: .04em; }
      .autobtn small { font-size: 9px; font-weight: 800; }
      .autobtn.on { background: radial-gradient(circle at 50% 35%, #fff3c4, var(--gold)); color: #4a3000; border-color: #b8860b; }
      .autobtn.on::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--gold); animation: autopulse 1.4s ease-out infinite; }
      @keyframes autopulse { from { transform: scale(.9); opacity: 1; } to { transform: scale(1.25); opacity: 0; } }
      .autobox .btn { background: var(--panel); }
      .btn.on { background: var(--title-b); color: #fff; border-color: var(--title-b); }
      .slot.empty { background: #e7edf8; border-style: dashed; }
      .slot.empty .cd { display: none; }
      .autohead { display: grid; gap: 4px; margin-bottom: 4px; }
      .autohead p { margin: 0; line-height: 1.45; }
      .alist { display: grid; gap: 5px; }
      .aslot { display: grid; grid-template-columns: 18px 36px 1fr auto; gap: 8px; align-items: center; background: #fff; border: 1px solid var(--panel-2); border-radius: 6px; padding: 5px 7px; }
      .aslot.off { opacity: .6; }
      .aslot .prio { font-weight: 800; color: var(--title-b); text-align: center; }
      .aslot img { width: 36px; height: 36px; }
      .aslot .nm { display: grid; gap: 2px; min-width: 0; }
      .aslot .nm small { color: var(--muted); }
      .aslot .ctl { display: grid; gap: 4px; justify-items: end; }
      .opts { display: grid; gap: 5px; }
      .opt { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--panel-2); border-radius: 6px; padding: 5px 8px; font-weight: 700; }
      select { font: 700 12px var(--ui); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 3px 4px; max-width: 100%; }
      .rates .btn { min-width: 46px; }
      @media (max-width: 720px) {
        .autobox { bottom: calc(66px + env(safe-area-inset-bottom, 0px)); }
        .autobtn { width: 54px; height: 54px; }
        .aslot { grid-template-columns: 14px 30px 1fr; }
        .aslot img { width: 30px; height: 30px; }
        .aslot .ctl { grid-column: 1 / -1; grid-template-columns: 1fr auto; justify-items: stretch; }
      }
      @media (prefers-reduced-motion: reduce) { .autobtn.on::after { animation: none; } }

      .death { z-index: 6; position: absolute; inset: 0; background: rgba(40, 0, 0, .45); display: grid; place-items: center; }
      .death .panel { padding: 14px 18px; text-align: center; width: min(320px, calc(100vw - 32px)); }
      .death b { font-family: var(--display); font-size: 20px; display: block; margin-bottom: 6px; }

      /* Tela de título */
      #title { position: fixed; inset: 0; display: grid; place-items: center; background: #0b1020 center / cover no-repeat; z-index: 5; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
      #title::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(8, 12, 30, .25), rgba(8, 12, 30, .8)); }
      #title .box { position: relative; text-align: center; display: grid; gap: 14px; justify-items: center; }
      #title h1 { margin: 0; font-family: var(--display); font-weight: 800; color: #fff6dd; font-size: clamp(34px, 8vw, 72px); letter-spacing: .03em; line-height: 1; text-shadow: 0 3px 0 #5a3b00, 0 0 30px rgba(255, 190, 80, .55); text-wrap: balance; }
      #title .sub { color: #e8eefc; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; font-size: 12px; text-shadow: 0 1px 3px #000; }
      #title .panel { padding: 12px; width: min(300px, calc(100vw - 40px)); display: grid; gap: 8px; }
      #title input { font: 700 14px var(--ui); padding: 7px 9px; border-radius: 4px; border: 1px solid var(--line); color: var(--ink); background: #fff; }
      #title .btn { padding: 8px 10px; font-size: 14px; }
      #title .ver { color: #cbd5ee; font-size: 11px; text-shadow: 0 1px 2px #000; }
      #title .help { color: #dfe6f8; font-size: 12px; max-width: 420px; line-height: 1.5; text-shadow: 0 1px 2px #000; }

      @media (max-width: 720px) {
        .basic { width: 178px; }
        .basic .tbar { display: none; }
        .menu button { font-size: 10px; padding: 4px 0; }
        .mini { width: 112px; }
        .mini .tbar { font-size: 10px; padding: 2px 5px; }
        .mini .coord { display: none; }
        .target { top: auto; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); width: 200px; }
        .log { bottom: calc(118px + env(safe-area-inset-bottom, 0px)); max-height: 60px; width: 60vw; }
        .log div { font-size: 10.5px; }
        .slot { width: 40px; height: 40px; }
        .slot img { width: 32px; height: 32px; }
        .hotbar { gap: 3px; padding: 4px; max-width: calc(100vw - 16px); }
        .stats { grid-template-columns: 1fr; }
        .equip { grid-template-columns: 1fr; }
        .banner { font-size: 24px; }
      }
      @media (prefers-reduced-motion: reduce) { .banner, .mapname, .bar .fill { transition: none; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud" hidden></div>
    <div id="title">
      <div class="box">
        <div class="sub">Uma aventura nas terras do Cavaleiro</div>
        <h1>Terras de Aurora</h1>
        <div class="panel" id="title-panel"></div>
        <div class="help">Clique no chão para andar e no monstro para atacar. Teclas 1–8 usam habilidades e itens. Z: caça automática · G: gerenciador de habilidades · C: status · I: itens · K: habilidades · X: sentar.</div>
        <div class="ver">versão 0.2 · experiência de teste 5x</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
